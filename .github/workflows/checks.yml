name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Macro matches src/
        run: python3 tools/build_macro.py --check
      - name: Macro compiles
        run: python3 -m py_compile macro/LiveSectionAnalyzer.FCMacro
      - name: Mesh core tests
        run: python3 tests/test_mesh_core.py
